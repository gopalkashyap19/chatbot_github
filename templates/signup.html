<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agent Signup</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .signup-box {
      width: 350px;
      padding: 25px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .signup-box h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #2c3e50;
    }
    .signup-box input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .conf {
        color: white;
        background: red;
        font-size: 13px;
        margin-top: -8px;
        margin-bottom: 10px;
    }
    .signup-box button {
      width: 100%;
      padding: 10px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
    }
    .signup-box button:hover {
      background: #2980b9;
    }
  </style>
</head>
<body>
  <div class="signup-box">
    <h2>Agent Signup</h2>
    <form action="{{url_for('auth.agent_signup')}}" method="post">
      <input type="text" name="agent_name" placeholder="Full Name" required>
      <input type="email" name="agent_email" placeholder="Email" required>
      <input type="password" name="agent_password" placeholder="Password" required>
      <input type="password" name="confirm_password" placeholder="Confirm Password" required>
      {%if conf %}
        <div class="conf"> {{conf}} </div>
      {%endif%}
      <button type="submit">Sign Up</button>
      <div class="extra-links">
      <p>Already have an account? <a href="{{url_for('login_page')}}">Sign In</a></p>
    </div>
    </form>
  </div>
</body>
</html>
