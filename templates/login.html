<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Portal</title>
  <style>
    body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #f4f6f9, #e9ecf2);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.login-box {
  width: 350px;
  padding: 30px;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.1);
  transition: transform 0.2s ease-in-out;
}

.login-box:hover {
  transform: translateY(-4px);
}

.login-box h2 {
  text-align: center;
  margin-bottom: 25px;
  color: #2c3e50;
  font-weight: 600;
  font-size: 1.6em;
  letter-spacing: 1px;
}

.login-box input {
  width: 100%;
  padding: 12px;
  margin: 12px 0;
  border: 1px solid #ccc;
  border-radius: 25px;
  outline: none;
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
  font-size: 0.95em;
}

.login-box input:focus {
  border-color: #3498db;
  box-shadow: 0 0 6px rgba(52, 152, 219, 0.4);
}

.login-box button {
  width: 100%;
  padding: 12px;
  background: linear-gradient(90deg, #3498db, #2980b9);
  color: white;
  border: none;
  border-radius: 25px;
  cursor: pointer;
  font-size: 1em;
  font-weight: bold;
  transition: background 0.3s ease, transform 0.2s ease;
}

.login-box button:hover {
  background: linear-gradient(90deg, #1f78c1, #145a86);
  transform: scale(1.05);
}

.msg {
  color: white;
  background: #e74c3c;
  font-size: 13px;
  margin-top: -8px;
  margin-bottom: 12px;
  padding: 6px 10px;
  border-radius: 6px;
  text-align: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}
.extra_links a {
      color: #3498db;
      text-decoration: none;
      font-size: 16px;
    }
    .extra_links {
      text-align: center;
      margin-top: 15px;
    }
    .extra_links a:hover {
      text-decoration: underline;
    }

  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login Portal</h2>
    <form action="{{url_for('auth.agent_login')}}" method="post">
      <input type="text" name="Lagent_name" placeholder="Username" required>
      <input type="password" name="Lagent_password" placeholder="Password" required>
      {%if msg %}
        <div class="msg"> {{msg}} </div>
      {%endif%}
      <button type="submit">Login</button>
      <div class="extra_links">
      <p>Don't have an account? <a href="{{url_for('signup_page')}}">Sign Up</a></p>
    </div>
    </form>
  </div>
</body>
</html>
