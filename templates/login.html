<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Portal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-box {
      width: 300px;
      padding: 20px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .login-box h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #2c3e50;
    }
    .login-box input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .login-box button {
      width: 100%;
      padding: 10px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
    }
    .msg{
        color: white;
        background: red;
        font-size: 13px;
        margin-top: -8px;
        margin-bottom: 10px;
    }
    .login-box button:hover {
      background: #2980b9;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login Portal</h2>
    <form action="{{url_for('auth.agent_login')}}" method="post">
      <input type="text" name="Lagent_name" placeholder="Username" required>
      <input type="password" name="Lagent_password" placeholder="Password" required>
      {%if msg %}
        <div class="msg"> {{msg}} </div>
      {%endif%}
      <button type="submit">Login</button>
      <div class="extra-links">
      <p>Don't have an account? <a href="{{url_for('signup_page')}}">Sign Up</a></p>
    </div>
    </form>
  </div>
</body>
</html>
