<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>User Information</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <link
        rel="icon"
        type="image/x-icon"
        href="{{ url_for('static', filename='favicon.ico') }}"
    >


    <style>

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }


        html,
        body {

            width: 100%;

            min-height: 100%;

        }


        body {

            font-family:

                "Segoe UI",
                Arial,
                sans-serif;


            background:

                linear-gradient(
                    135deg,
                    #089cbe,
                    #0813ac,
                    #09cba7
                );


            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

        }


        /* =========================================
           AGENT LOGIN
        ========================================= */

        .agent {

            position: fixed;

            top: 20px;

            right: 25px;

            text-decoration: none;

            color: white;

            background:

                linear-gradient(
                    135deg,
                    #0813ac,
                    #089cbe
                );


            padding: 10px 22px;

            border-radius: 25px;

            font-weight: bold;

            font-size: 15px;

            box-shadow:

                0 5px 15px
                rgba(0,0,0,0.2);

            transition: 0.2s;

        }


        .agent:hover {

            transform: scale(1.05);

        }


        /* =========================================
           MAIN CONTAINER
        ========================================= */

        .container {

            width: 100%;

            max-width: 650px;

            background: white;

            border-radius: 22px;

            overflow: hidden;

            box-shadow:

                0 15px 50px
                rgba(0,0,0,0.3);

        }


        /* =========================================
           HEADER
        ========================================= */

        .header {

            background:

                linear-gradient(
                    135deg,
                    #089cbe,
                    #0813ac,
                    #09cba7
                );


            color: white;

            padding: 25px;

            text-align: center;

        }


        .header h1 {

            font-size: 28px;

            margin-bottom: 8px;

        }


        .header p {

            font-size: 15px;

            opacity: 0.9;

        }


        /* =========================================
           FORM
        ========================================= */

        .form-container {

            padding: 30px;

        }


        .form-grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 20px;

        }


        .form-group {

            display: flex;

            flex-direction: column;

        }


        .form-group.full-width {

            grid-column:
                span 2;

        }


        label {

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 8px;

            color: #333;

        }


        input,
        select {

            width: 100%;

            padding: 14px 16px;

            border:

                2px solid #e1e5eb;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;

            background: #f8fafc;

        }


        input:focus,
        select:focus {

            border-color: #089cbe;

            background: white;

            box-shadow:

                0 0 0 3px
                rgba(8,156,190,0.12);

        }


        /* =========================================
           GO TO CHAT BUTTON
        ========================================= */

        .go-chat-btn {

            width: 100%;

            margin-top: 28px;

            padding: 15px;

            border: none;

            border-radius: 12px;

            cursor: pointer;

            color: white;

            font-size: 17px;

            font-weight: bold;

            background:

                linear-gradient(
                    135deg,
                    #089cbe,
                    #0813ac,
                    #09cba7
                );


            transition: 0.25s;

            box-shadow:

                0 6px 18px
                rgba(8,100,190,0.3);

        }


        .go-chat-btn:hover {

            transform:

                translateY(-2px);

            box-shadow:

                0 10px 25px
                rgba(8,100,190,0.4);

        }


        .go-chat-btn:active {

            transform:

                translateY(0);

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media
        (
            max-width: 600px
        ) {

            body {

                padding: 15px;

                align-items: center;

            }


            .agent {

                top: 10px;

                right: 10px;

                padding: 8px 15px;

                font-size: 13px;

            }


            .container {

                margin-top: 45px;

                border-radius: 18px;

            }


            .header {

                padding: 22px 15px;

            }


            .header h1 {

                font-size: 23px;

            }


            .form-container {

                padding: 22px 18px;

            }


            .form-grid {

                grid-template-columns:
                    1fr;

                gap: 16px;

            }


            .form-group.full-width {

                grid-column:
                    span 1;

            }


        }

    </style>

</head>


<body>


<!-- =========================================
     AGENT LOGIN
========================================= -->

<a
    href="{{ url_for('login_page') }}"
    class="agent"
>

    Agent Login

</a>



<!-- =========================================
     MAIN CONTAINER
========================================= -->

<div class="container">


    <!-- HEADER -->

    <div class="header">

        <h1>
            Welcome to Our Chatbot 👋
        </h1>

        <p>
            Please provide your details before starting the chat.
        </p>

    </div>



    <!-- FORM -->

    <div class="form-container">


        <form
            method="POST"
            action="{{ url_for('chatbot') }}"
        >


            <div class="form-grid">


                <!-- NAME -->

                <div class="form-group">

                    <label>
                        Your Name
                    </label>

                    <input

                        type="text"

                        name="name"

                        placeholder="Enter your name"

                        required

                    >

                </div>



                <!-- COUNTRY -->

                <div class="form-group">

                    <label>
                        Country
                    </label>

                    <select
                        name="country"
                        required
                    >

                        <option value="">
                            Select Country
                        </option>

                        <option value="India (+91)">
                            India (+91)
                        </option>

                        <option value="USA (+1)">
                            USA (+1)
                        </option>

                        <option value="UK (+44)">
                            UK (+44)
                        </option>

                    </select>

                </div>



                <!-- MOBILE -->

                <div class="form-group">

                    <label>
                        Mobile Number
                    </label>

                    <input

                        type="tel"

                        name="mobile"

                        placeholder="Enter mobile number"

                        required

                    >

                </div>



                <!-- EMAIL -->

                <div class="form-group">

                    <label>
                        Email Address
                    </label>

                    <input

                        type="email"

                        name="email"

                        placeholder="Enter your email"

                        required

                    >

                </div>



                <!-- SERVICE -->

                <div class="form-group full-width">

                    <label>
                        What is your query related to?
                    </label>


                    <select
                        name="service"
                        required
                    >

                        <option value="">
                            Select a service
                        </option>

                        <option value="Room Bookings">
                            Room Bookings
                        </option>

                        <option value="Expenses">
                            Expenses
                        </option>

                        <option value="Staff Related">
                            Staff Related
                        </option>

                        <option value="Attendence Related">
                            Attendance Related
                        </option>

                        <option value="Reports">
                            Reports
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


            </div>



            <!-- GO TO CHAT -->

            <button
                type="submit"
                class="go-chat-btn"
            >

                Go To Chat 💬

            </button>


        </form>


    </div>


</div>


</body>

</html>
