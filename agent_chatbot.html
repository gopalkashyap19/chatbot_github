<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Chatbot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .chat-container {
      width: 500px;
      height: 600px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }
    .chat-header {
      background: #ff69b4;
      color: #fff;
      padding: 15px;
      text-align: center;
      font-weight: bold;
      border-radius: 8px 8px 0 0;
    }
    .agent_chat-box {
      flex: 1;
      overflow-y: auto;
    }
    .message {
      margin: 10px 0;
      padding: 10px;
      border-radius: 6px;
      max-width: 80%;
    }
    .user {
      background: #d1e7ff;
      align-self: flex-end;
    }
    .bot {
      background: #f0f0f0;
      align-self: flex-start;
    }
    .chat-form2 {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ddd;
    }
    .chat-form2 input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .chat-form2 button {
      margin-left: 10px;
      padding: 10px 20px;
      background: #ff69b4;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .user{
        background: #0389f7;
        color: white;
    }
    .agent{
        background: #04f0f4;
        color: black;
    }
    .chatbot{
        background: #ff1493;
        color: white;
    }
    .chat-form2 button:hover {
      background: #ff1493;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">Agent's Chatbot</header>
    <div class="agent_chat-box" id="agent_chat-box">
        {% for res in ress %}
            <div class="{{res.role}}">{{res.role}} : {{res.message}}</div>
        {% endfor %}
        
      <!-- Messages will appear here -->
    </div>
    <form class="chat-form2" id="chat-form2">

      <input type="text" id="response" name="response" placeholder="Type your message..." required>
      <button type="submit">Send</button>
    </form>
  </div>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    var socket = io();
    var user_Id = "{{user_id}}";
    var room_Id = "{{room_id}}";

    socket.emit("join_room",{user_id : user_Id});

    document.getElementById("chat-form2").addEventListener("submit",function(e){
      e.preventDefault();
      var res_mess = document.getElementById("response").value;
      socket.emit("agent_res",{response : res_mess,user_id : user_Id,room_id : room_Id});
      document.getElementById("response").value="";
    });
    socket.on("new_message",function(data){
    var div = document.createElement("div");
    div.className = data.role;
    div.innerText = data.role + " :" + data.message;
    document.querySelector("#agent_chat-box").appendChild(div);
  });
  </script>
</body>
</html>
